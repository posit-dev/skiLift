# Continuous integration for skiLift
# Runs offline unit tests and R CMD check on push/PR to main.
# No Snowflake credentials required (all tests use mock objects).

name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On demand. Without this the only way to get a CI result is to push, which
  # is awkward when the badge is stale for a reason unrelated to the code --
  # as it was when Actions itself was disabled on the fork and the README
  # badge read "no status" with no way to clear it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: '4.4'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # Keep renv out of CI. renv.lock pins repos to cloud.r-project.org, and
      # renv/activate.R (via .Rprofile) reasserts that in every R process --
      # which silently defeats setup-r's use-public-rspm. CRAN serves no Linux
      # binaries, so every dependency then built from source on ubuntu and
      # `fs` and `png` failed for want of libuv1-dev/libpng-dev, cascading into
      # testthat (via pkgload) and reticulate. macOS passed throughout because
      # CRAN does ship macOS binaries. renv is the right tool for the
      # development environment; CI should check against current RSPM/CRAN.
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        run: |
          # testthat explicitly, not as a Suggests via install_deps: it is test
          # infrastructure, and letting it arrive with the optional dependencies
          # means one unavailable Suggests takes the whole test step down two
          # steps later as "there is no package called 'testthat'".
          install.packages(c("remotes", "rcmdcheck", "testthat"))
          remotes::install_deps(".", dependencies = TRUE)
        shell: Rscript {0}

      - name: Run tests
        run: |
          testthat::test_local(".", reporter = "summary")
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            path = ".",
            args = c("--no-manual", "--as-cran"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-R${{ matrix.config.r }}-results
          path: check
